<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفاجأة ليكي ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="center-page">
  <main class="panel">
    <div class="heart">♥</div>
    <p class="eyebrow">A SPECIAL DAY, A SPECIAL PERSON : saloka</p>
    <h1>انهارده اهم يوم في الدنيا </h1>
    <p>دخّلي تاريخ ميلادك عشان نبدأ مفاجأتك ❤️</p>

    <form id="birthday-form">
      <input id="birthday" type="text"
        inputmode="numeric"
        placeholder="DD/MM/YYYY"
        maxlength="10"
        autocomplete="off"
        required>
      <button class="btn" type="submit">افتحي عالمك ♥</button>
    </form>

    <p id="message" class="message" aria-live="polite"></p>
    <p class="small">كل سنة وإنتي صاحبه اجمل عيون ✨</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
